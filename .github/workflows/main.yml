
name: Build Shubhadisha Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'shubhadisha-erp (1).zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "shubhadisha-erp (1).zip" -d android-project
          WRAPPER=$(find android-project -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: Android project or gradlew not found in ZIP."
            echo "The ZIP may not contain a complete Android Studio project."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shubhadisha-ERP-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
